<!doctype html><html><head><meta charset="utf-8"><title>TV Power House – TV home reference (960x540dp)</title>
<style>
@font-face{font-family:Manrope;font-weight:600;src:url(../assets/web/fonts/Manrope-600.woff2)}
@font-face{font-family:Manrope;font-weight:700;src:url(../assets/web/fonts/Manrope-700.woff2)}
@font-face{font-family:Manrope;font-weight:800;src:url(../assets/web/fonts/Manrope-800.woff2)}
@font-face{font-family:JB;font-weight:500;src:url(../assets/web/fonts/JetBrainsMono-500.woff2)}
:root{--bg:#0B0C0E;--s1:#17181B;--s2:#1E2024;--s3:#272A30;--line:rgba(255,255,255,.08);--text:#F2F1EE;--t2:#A5A7AD;--accent:#FF6B3D;--ok:#4CD39A;--warn:#F5B544;--danger:#FF5A5F}
*{box-sizing:border-box;margin:0}
html,body{width:960px;height:540px;overflow:hidden;background:var(--bg);font-family:Manrope,"Inter","Segoe UI",Roboto,"Liberation Sans",sans-serif;color:var(--text)}
.stage{position:relative;width:960px;height:540px;display:flex;align-items:center;padding:0 72px;
 background:
  radial-gradient(520px 420px at 76% 50%,rgba(255,107,61,.20),transparent 70%),
  radial-gradient(700px 500px at 8% 105%,rgba(76,211,154,.07),transparent 70%),
  linear-gradient(180deg,#0F1012,#0B0C0E)}
.stage::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:24px 24px;mask-image:radial-gradient(ellipse at 50% 50%,#000 30%,transparent 80%);pointer-events:none}
.left{flex:1.1;display:flex;flex-direction:column;gap:22px;z-index:1}
.brand{display:flex;align-items:center;gap:18px}
.brand img{width:72px;height:72px;border-radius:18px;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 14px 34px -8px rgba(255,107,61,.45)}
.brand h1{font-weight:800;font-size:38px;letter-spacing:-.02em;line-height:1}
.pill{display:inline-flex;align-self:flex-start;align-items:center;gap:12px;height:44px;padding:0 20px 0 16px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:700;font-size:20px}
.dot{position:relative;width:12px;height:12px;border-radius:50%;background:var(--c)}
.dot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--c);opacity:.0;animation:ping 2.4s var(--anim,ease-out) infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.url{font-family:JB,monospace;font-weight:500;font-size:26px;letter-spacing:-.01em;color:var(--text);padding:14px 20px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);align-self:flex-start}
.url b{color:var(--accent);font-weight:500}
.btn{align-self:flex-start;display:inline-flex;align-items:center;gap:12px;height:56px;padding:0 28px 0 22px;border-radius:18px;font-weight:700;font-size:20px;font-family:inherit;color:var(--text);background:var(--s2);border:1px solid var(--s3);margin-top:6px}
.btn.focus{background:var(--accent);color:#1A0B05;border-color:transparent;box-shadow:0 0 0 3px var(--bg),0 0 0 6px rgba(255,107,61,.55),0 18px 40px -10px rgba(255,107,61,.6);transform:scale(1.04)}
.right{flex:1;display:flex;justify-content:center;z-index:1}
.card{position:relative;width:324px;height:324px;border-radius:36px;padding:14px;background:linear-gradient(145deg,#fff,#EDEAE3);box-shadow:0 0 0 1px rgba(255,255,255,.5) inset,0 30px 70px -18px rgba(0,0,0,.8),0 0 90px -10px rgba(255,107,61,.35);overflow:hidden}
.card svg{width:100%;height:100%;display:block;border-radius:24px}
.card.fade svg{opacity:.18;filter:blur(2px)}
.card.skel{background:linear-gradient(145deg,#26282D,#1B1D21);box-shadow:0 0 0 1px var(--line) inset,0 30px 70px -18px rgba(0,0,0,.8)}
.skel .grid{position:absolute;inset:14px;border-radius:24px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 10px,transparent 10px 20px),repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 10px,transparent 10px 20px);opacity:.6}
.shimmer::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,107,61,.22) 50%,transparent 65%);transform:translateX(-100%);animation:sh 1.8s infinite}
@keyframes sh{to{transform:translateX(100%)}}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff}
.ov .c{width:84px;height:84px;border-radius:26px;background:rgba(16,17,19,.82);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(8px)}
svg.i{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div class="stage" id="stage">
 <div class="left">
  <div class="brand"><img src="../assets/brand/logo_512.png"><h1>TV Power House</h1></div>
  <div class="pill" id="pill"><span class="dot" id="dot"></span><span id="st"></span></div>
  <div class="url" id="url"></div>
  <div class="btn focus"><svg class="i" style="width:24px;height:24px" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>Restart server</div>
 </div>
 <div class="right"><div class="card" id="card"></div></div>
</div>
